name: volume-alert

on:
  schedule:
    # 02:15-04:00 UTC = 09:15-11:00 giờ VN, T2-T6, mỗi 5 phút
    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi 1 tin thử rồi thoát"
        type: boolean
        default: false

concurrency:
  group: volume-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore cache (TB20 + state)
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            avg20.json
            state.json
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Run alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RATIO: ${{ vars.RATIO || '0.5' }}
        run: python3 alert.py ${{ inputs.test && '--test' || '' }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            avg20.json
            state.json
          key: data-${{ github.run_id }}
